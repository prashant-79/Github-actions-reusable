name: reusable build flow
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        default: development
      node-version:
        required: false
        type: string
        default: '18' 
      run-tests:
        required: false
        type: boolean
        default: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs['node-version'] }}

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run tests
        if: ${{ inputs['run-tests'] }}
        run: npm test
